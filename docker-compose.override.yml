# Development overrides — automatically merged by Docker Compose
# Adds volume mounts so code changes reflect instantly without rebuilding

services:
  ai-service:
    volumes:
      - ./services/ai-service:/app

  quote-service:
    volumes:
      - ./services/quote-service:/app

  booking-service:
    volumes:
      - ./services/booking-service:/app

  mock-providers:
    volumes:
      - ./services/mock-providers:/app

  frontend:
    # Bind-mount the source for live reload, but keep the image's installed
    # node_modules and Next.js build cache (anonymous volumes shadow the mount)
    # so host files don't clobber them.
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
